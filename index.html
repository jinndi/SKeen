    function handleExtraParamChange() {
      const val = document.getElementById('extraParam').value;
      const container = document.getElementById('extraParamsContainer');
      container.innerHTML = '';

      if (val === 'restore') {
        container.style.display = 'flex';
        container.innerHTML = `
          <div class="form-group" style="margin: 0;">
            <label>${t('lblBackupFile')}</label>
            <input type="text" id="paramBackupFile" placeholder="${t('placeholderBackupFile')}">
          </div>`;
      } else if (val === 'sync') {
        container.style.display = 'flex';
        container.innerHTML = `
          <div class="form-group" style="margin: 0;">
            <label>${t('lblSyncUrl')}</label>
            <input type="text" id="paramSyncUrl" placeholder="${t('placeholderSyncUrl')}" oninput="validateField(this, 'url')">
          </div>`;
      } else if (val === 'tun') {
        container.style.display = 'flex';
        container.innerHTML = `
          <div class="form-group" style="margin: 0;">
            <label>${t('lblTunSubCommand')}</label>
            <select id="paramTunSub" onchange="handleTunSubChange()">
              <option value="list">tun list</option>
              <option value="create">tun create</option>
              <option value="delete">tun delete</option>
            </select>
          </div>
          <div id="tunSubInputsContainer" style="display: none; flex-direction: column; gap: 8px;"></div>`;
        handleTunSubChange();
      } else {
        container.style.display = 'none';
      }
    }

    function handleTunSubChange() {
      const subVal = document.getElementById('paramTunSub').value;
      const subContainer = document.getElementById('tunSubInputsContainer');
      subContainer.innerHTML = '';

      if (subVal === 'create') {
        subContainer.style.display = 'flex';
        subContainer.innerHTML = `
          <div class="form-row" style="gap: 8px;">
            <div class="form-group" style="flex: 1; margin: 0;">
              <label>${t('lblIpAddress')}</label>
              <input type="text" id="paramTunIp" placeholder="${t('placeholderIpAddress')}" oninput="validateField(this, 'ip')">
            </div>
            <div class="form-group" style="flex: 1; margin: 0;">
              <label>${t('lblIfaceName')}</label>
              <input type="text" id="paramTunIface" placeholder="${t('placeholderIfaceName')}">
            </div>
          </div>`;
      } else if (subVal === 'delete') {
        subContainer.style.display = 'flex';
        subContainer.innerHTML = `
          <div class="form-group" style="margin: 0;">
            <label>${t('lblIfaceName')}</label>
            <input type="text" id="paramTunIface" placeholder="${t('placeholderIfaceName')}">
          </div>`;
      } else {
        subContainer.style.display = 'none';
      }
    }

    async function executeCommandParam(param) {
      const baseUrl = getBaseUrl();
      if (!baseUrl) { showAlertModal(t('alertNeedSetup'), openConnModal); return; }

      if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
      }

      const outputEl = document.getElementById('cmdOutput');
      outputEl.textContent = t('executing');

      const disabledElements = document.querySelectorAll('button, select, input');
      disabledElements.forEach(el => el.disabled = true);

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        const res = await fetch(`${baseUrl}/api/exec`, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({ param }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: res.statusText }));
          throw new Error(err.error || `Error ${res.status}`);
        }

        const data = await res.json();
        outputEl.innerHTML = renderAnsiOutput(data.stdout || t('emptyOutput'));

        if (param === 'areload') {
          setTimeout(() => {
            window.location.reload();
          }, 3000);
        }
      } catch (e) {
        outputEl.innerHTML = `<span class="ansi-red">Error: ${e.name === 'AbortError' ? 'Request timeout (30s limit exceeded)' : e.message}</span>`;
      } finally {
        if (param !== 'areload') {
          disabledElements.forEach(el => el.disabled = false);
          await fetchServiceStatus();
          startPolling();
        }
      }
    }

    async function executeExtraCommand() {
      const selectedCmd = document.getElementById('extraParam').value;
      let finalParam = selectedCmd;

      if (selectedCmd === 'restore') {
        const fileName = (document.getElementById('paramBackupFile')?.value || '').trim();
        if (!fileName) { showAlertModal(t('alertEmptyParam')); return; }
        finalParam = `restore ${fileName}`;
      } else if (selectedCmd === 'sync') {
        const urlInput = document.getElementById('paramSyncUrl');
        const url = (urlInput?.value || '').trim();
        if (url && urlInput.classList.contains('invalid-input')) { showAlertModal(t('alertEmptyParam')); return; }
        finalParam = url ? `sync ${url}` : 'sync';
      } else if (selectedCmd === 'tun') {
        const subCmd = document.getElementById('paramTunSub').value;
        if (subCmd === 'list') {
          finalParam = 'tun list';
        } else if (subCmd === 'create') {
          const ipInput = document.getElementById('paramTunIp');
          const ip = (ipInput?.value || '').trim();
          const iface = (document.getElementById('paramTunIface')?.value || '').trim();
          if (!ip || !iface || ipInput.classList.contains('invalid-input')) { showAlertModal(t('alertEmptyParam')); return; }
          finalParam = `tun create ${ip} ${iface}`;
        } else if (subCmd === 'delete') {
          const iface = (document.getElementById('paramTunIface')?.value || '').trim();
          if (!iface) { showAlertModal(t('alertEmptyParam')); return; }
          finalParam = `tun delete ${iface}`;
        }
      }

      await executeCommandParam(finalParam);
    }

    /* ==========================================================================
       Editor Highlighting & Utilities
       ========================================================================== */
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightJson(text) {
      if (!text) return '';
      return escapeHtml(text).replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
        let cls = 'token-number';
        if (/^"/.test(match)) cls = /:$/.test(match) ? 'token-key' : 'token-string';
        else if (/true|false/.test(match)) cls = 'token-boolean';
        else if (/null/.test(match)) cls = 'token-null';
        return '<span class="' + cls + '">' + match + '</span>';
      });
    }

    function updateLineNumbers() {
      const lineNumbers = document.getElementById('lineNumbers');
      const totalLines = cachedLines.length;
      const linesArr = new Array(totalLines);
      for (let i = 0; i < totalLines; i++) linesArr[i] = i + 1;
      lineNumbers.textContent = linesArr.join('\n');
    }

    let highlightTimeout = null;
    function handleEditorInput() {
      const textarea = document.getElementById('jsonEditor');
      cachedLines = textarea.value.split('\n');
      updateLineNumbers();
      if (highlightTimeout) clearTimeout(highlightTimeout);
      highlightTimeout = setTimeout(() => updateEditorVisuals(), 20);
    }

    function updateEditorVisuals() {
      const textarea = document.getElementById('jsonEditor');
      const content = document.getElementById('highlightingContent');
      const fileSelect = document.getElementById('configFileSelect');
      const fileName = fileSelect.options[fileSelect.selectedIndex]?.text || '';
      const text = textarea.value;

      content.innerHTML = (fileName.endsWith('.list') || fileName.endsWith('.txt')) ? escapeHtml(text) : highlightJson(text);
      content.style.paddingTop = '0px';
      content.style.paddingBottom = '0px';
    }

    let isScrolling = false;
    function syncScroll() {
      if (isScrolling) return;
      isScrolling = true;
      requestAnimationFrame(() => {
        const textarea = document.getElementById('jsonEditor');
        const highlighting = document.getElementById('highlighting');
        const lineNumbers = document.getElementById('lineNumbers');
        highlighting.scrollTop = textarea.scrollTop;
        highlighting.scrollLeft = textarea.scrollLeft;
        lineNumbers.scrollTop = textarea.scrollTop;
        isScrolling = false;
      });
    }

    function handleEditorKeydown(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const textarea = e.target;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const value = textarea.value;

        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        let lineEnd = value.indexOf('\n', end);
        if (lineEnd === -1) lineEnd = value.length;

        const selectedText = value.substring(lineStart, lineEnd);
        const lines = selectedText.split('\n');

        let newSelectedText;
        if (e.shiftKey) {
          newSelectedText = lines.map(line => {
            if (line.startsWith('  ')) return line.substring(2);
            if (line.startsWith(' ')) return line.substring(1);
            return line;
          }).join('\n');
        } else {
          newSelectedText = lines.map(line => '  ' + line).join('\n');
        }

        textarea.value = value.substring(0, lineStart) + newSelectedText + value.substring(lineEnd);
        textarea.selectionStart = lineStart;
        textarea.selectionEnd = lineStart + newSelectedText.length;

        handleEditorInput();
      }
    }
  </script>
