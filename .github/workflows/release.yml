on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: build

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GH_PAT }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - uses: actions/setup-go@v5
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          go-version-file: .github/shell-minifier/go.mod
          cache-dependency-path: .github/shell-minifier/go.sum

      - name: Install shfmt
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          SHFMT_VERSION="v3.14.1"
          sudo curl -fsSL -o /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

      - name: Test and build scripts
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          (cd .github/shell-minifier && go test ./...)
          sh .github/build-shell-scripts.sh dist

      - name: Upload SKeen
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} dist/skeen dist/skeen_ru
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
