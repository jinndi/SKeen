on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

name: Sync static branch

jobs:
  build-and-push:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build skeen-api
        run: |
          npm install html-minifier-terser esbuild-minify-templates luamin
          node .github/build-api.js
          cp skeen-api skeen-api_tmp
          cp api-version api-version_tmp

      - name: Prepare and Push to Static Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHFMT_VERSION="v3.14.1"
          sudo curl -sL -o /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

          shfmt -s -mn skeen.sh > skeen_min
          shfmt -s -mn skeen_ru.sh > skeen_ru_min

          cp config.json config.json_tmp
          cp config_beta.json config_beta.json_tmp

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin static; then
            git checkout -f static
          else
            git checkout --orphan static
            git rm -rf .
          fi

          mv skeen_min skeen
          mv skeen_ru_min skeen_ru
          mv config.json_tmp config.json
          mv config_beta.json_tmp config_beta.json
          mv skeen-api_tmp skeen-api
          mv api-version_tmp api-version

          FILES="skeen skeen_ru config.json config_beta.json skeen-api api-version"

          if [ -n "$(git status --porcelain $FILES)" ]; then
            git add $FILES
            git commit -m "dist: update optimized scripts and config $(date +'%Y-%m-%d %H:%M')"
            git push origin static

            for file in $FILES; do
              curl -sfL "https://purge.jsdelivr.net/gh/jinndi/SKeen@static/$file" || true
            done
          else
            echo "No changes to commit"
          fi
